<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#eee7da">
  <title>月明かりの窓辺</title>
  <link rel="stylesheet" href="style.css?v=8">
  <script src="app.js?v=8" defer></script>
</head>
<body>
  <main class="book">
    <span id="back-icon" aria-hidden="true">←</span>
    <button id="camera" type="button" aria-label="作品を画像で保存・共有" disabled><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z" stroke-linejoin="round"/><circle cx="12" cy="13" r="4"/></svg></button>
    <section class="workspace" aria-label="ステッカーの台紙">
      <div id="board"><img class="background" src="assets/background.png" alt="月明かりを待つ洋館の窓辺" draggable="false"><div id="stickers"></div></div>
    </section>
    <button id="save-layout" type="button" aria-label="配置を保存" disabled><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5h7l2 3h9v12H3z" stroke-linejoin="round"/></svg></button>
    <p id="save-notice" role="status" hidden></p>
    <footer id="controls">
      <div id="tray" aria-label="ステッカー素材"></div>
    </footer>
    <div id="selection-menu" role="group" aria-label="選択中のステッカーの操作" hidden><button id="remove" type="button">削除</button></div>
    <p id="status" role="status" class="sr-only"></p>
    <dialog id="save-preview" aria-labelledby="save-title">
      <h2 id="save-title">作品を保存</h2><p id="save-message">画像を長押しして保存できます。</p>
      <img id="saved-artwork" alt="保存する作品">
      <div class="save-actions"><a id="download-artwork" download="moonlit-sticker-book.png">画像をダウンロード</a><button id="close-preview" type="button">閉じる</button></div>
    </dialog>
  </main>
</body>
</html>

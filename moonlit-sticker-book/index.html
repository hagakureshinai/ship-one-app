<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#eee7da">
  <title>月明かりの窓辺</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <main class="book">
    <span id="back-icon" aria-hidden="true">←</span>
    <section class="workspace" aria-label="ステッカーの台紙">
      <div id="board"><img class="background" src="assets/background.png" alt="月明かりを待つ洋館の窓辺" draggable="false"><div id="stickers"></div></div>
    </section>
    <footer id="controls">
      <div id="tray" aria-label="ステッカー素材"></div>
      <div id="selection-menu" hidden><button id="remove" type="button">削除</button><button id="deselect" type="button">選択を解除</button></div>
    </footer>
    <p id="status" role="status" class="sr-only"></p>
  </main>
</body>
</html>
